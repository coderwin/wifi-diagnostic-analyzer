[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wifi-sentinel"
version = "0.1.0"
description = "Cross-platform Wi-Fi diagnostic analyzer & incident pattern reporter for Windows and Linux"
authors = [
    { name = "coderwin" }
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "psutil>=5.9.0",
    "ping3>=4.0.0",
    "dnspython>=2.6.0",
    "requests>=2.31.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "APScheduler>=3.10.4",
    "typer[all]>=0.12.0",
    "rich>=13.7.0",
    "SQLAlchemy>=2.0.0",
    "aiosqlite>=0.20.0",
    "Jinja2>=3.1.3",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
]

[project.scripts]
wifi-sentinel = "src.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
